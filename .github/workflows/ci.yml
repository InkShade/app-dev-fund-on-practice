# Same stages as the Jenkinsfile, with SonarQube Cloud instead of the local SonarQube server
name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MAVEN_ARGS: --batch-mode --no-transfer-progress

jobs:
  build:
    name: Build, test and analyse
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Sonar needs the full history to assign issues to commits and detect new code
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build
        run: ./mvnw clean compile

      - name: Unit tests
        run: ./mvnw test

      - name: Integration tests and coverage
        run: ./mvnw verify -DskipUnitTests=true

      - name: SonarQube Cloud analysis and quality gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./mvnw sonar:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=inkshade
          -Dsonar.projectKey=InkShade_app-dev-fund-on-practice
          -Dsonar.qualitygate.wait=true

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
          if-no-files-found: ignore

      - name: Upload application jar
        uses: actions/upload-artifact@v4
        with:
          name: fridgechef-jar
          path: target/*.jar
