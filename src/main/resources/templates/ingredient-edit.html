<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head(${overview.ingredient().name()})}"></head>
<body>
<header th:replace="~{fragments/layout :: header('ingredients')}"></header>
<main class="container" th:with="ingredient=${overview.ingredient()}, usage=${overview.usage()}">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <a class="back" th:href="@{/ingredients}">← Ingredient catalogue</a>
    <h1 th:text="'Edit ' + ${ingredient.name()}">Edit Milk</h1>

    <div class="grid-2">
        <section class="card">
            <h2>Details</h2>
            <form class="form-stacked" th:action="@{/ingredients/{id}(id=${ingredient.id()})}"
                  th:object="${ingredientForm}" method="post">
                <label>
                    Name
                    <input type="text" th:field="*{name}" maxlength="100" required>
                    <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
                </label>
                <label>
                    Unit
                    <select th:field="*{unit}" required>
                        <option th:each="unit : ${units}" th:value="${unit}" th:text="${unit.symbol}">g</option>
                    </select>
                    <span class="hint" th:if="${usage.isUsed()}">
                        Can only be changed while the ingredient is not used anywhere.
                    </span>
                    <span class="field-error" th:if="${#fields.hasErrors('unit')}" th:errors="*{unit}"></span>
                </label>
                <label>
                    Shelf life, days
                    <input type="number" min="1" max="3650" th:field="*{shelfLifeDays}" required>
                    <span class="hint">Applies to products added from now on. Existing best-before dates stay.</span>
                    <span class="field-error" th:if="${#fields.hasErrors('shelfLifeDays')}" th:errors="*{shelfLifeDays}"></span>
                </label>
                <div class="button-row">
                    <button type="submit" class="button">Save</button>
                    <a class="button button-secondary" th:href="@{/ingredients}">Cancel</a>
                </div>
            </form>
        </section>

        <section class="card">
            <h2>Where it is used</h2>
            <ul class="list">
                <li><span>Recipes</span><strong th:text="${usage.recipes()}">2</strong></li>
                <li><span>Fridge</span><strong th:text="${usage.fridgeItems()}">1</strong></li>
                <li><span>Shopping list</span><strong th:text="${usage.shoppingListItems()}">0</strong></li>
            </ul>
            <p class="muted" th:if="${usage.isUsed()}">
                A new name shows up everywhere right away. To delete the ingredient, first remove it from the
                fridge and the shopping list. Ingredients used in recipes cannot be deleted.
            </p>
            <form th:action="@{/ingredients/{id}/delete(id=${ingredient.id()})}" method="post">
                <button type="submit" class="button button-danger" th:disabled="${usage.isUsed()}">
                    Delete ingredient
                </button>
            </form>
        </section>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
