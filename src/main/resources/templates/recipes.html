<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Recipes')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('recipes')}"></header>
<main class="container">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="page-header">
        <h1>Recipes for your fridge</h1>
        <form class="filter" th:action="@{/recipes}" method="get">
            <label for="minMatch">Show recipes matching at least</label>
            <select id="minMatch" name="minMatch" onchange="this.form.submit()">
                <option th:each="value : ${ {0, 25, 50, 75, 100} }"
                        th:value="${value}" th:text="${value} + '%'"
                        th:selected="${value == minMatch}">0%</option>
            </select>
            <noscript><button type="submit" class="button button-secondary">Filter</button></noscript>
        </form>
    </div>

    <p class="muted" th:if="${#lists.isEmpty(matches)}">No recipes match this filter.</p>

    <div class="recipe-grid">
        <article class="card recipe-card" th:each="match : ${matches}">
            <div class="recipe-card-header">
                <h2><a th:href="@{/recipes/{id}(id=${match.recipeId()})}" th:text="${match.name()}">Omelette</a></h2>
                <span class="pill" th:classappend="${match.canCook()} ? 'pill-success'"
                      th:text="${match.matchPercent()} + '%'">100%</span>
            </div>
            <div class="progress" th:attr="aria-label=${match.matchPercent()} + '% of ingredients available'">
                <span th:style="'width:' + ${match.matchPercent()} + '%'"></span>
            </div>
            <p th:text="${match.description()}">A quick breakfast.</p>
            <p class="meta">
                <span th:text="'⏱ ' + ${match.cookingTimeMinutes()} + ' min'">⏱ 10 min</span>
                <span th:if="${match.expiringIngredientsUsed() > 0}" class="badge badge-expiring_soon"
                      th:text="'uses ' + ${match.expiringIngredientsUsed()} + ' expiring product(s)'">uses 1 expiring</span>
            </p>
            <p class="muted" th:unless="${match.canCook()}">
                Missing:
                <span th:each="missing, stat : ${match.missingIngredients()}"
                      th:text="${missing.ingredientName()} + ${stat.last ? '' : ', '}">Eggs</span>
            </p>
            <p class="ready" th:if="${match.canCook()}">✔ You have everything</p>
        </article>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
